services:
  bgp-analyzer:
    build: .
    container_name: bgp-incident-analyzer
    ports:
      - "${BGP_ANALYZER_BIND:-127.0.0.1}:${BGP_ANALYZER_PORT:-17991}:17991"
    environment:
      BGP_ANALYZER_QUERY_TIMEOUT_SECONDS: "${BGP_ANALYZER_QUERY_TIMEOUT_SECONDS:-90}"
      BGP_ANALYZER_MAX_EVENTS: "${BGP_ANALYZER_MAX_EVENTS:-10000}"
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m
