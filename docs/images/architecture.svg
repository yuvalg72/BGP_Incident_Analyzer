<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">BGP Incident Analyzer architecture</title>
  <desc id="desc">Data flows from RIPE RIS and Route Views through CAIDA BGPStream into the FastAPI analysis service and the browser interface.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1"><stop stop-color="#142d38"/><stop offset="1" stop-color="#1d4652"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10262d" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#126d61"/></marker>
    <style>
      .label{font:700 24px Arial,sans-serif;fill:#142027}.small{font:400 18px Arial,sans-serif;fill:#62717a}.tag{font:700 15px Arial,sans-serif;fill:#126d61;letter-spacing:1px}.flow{fill:none;stroke:#126d61;stroke-width:5;marker-end:url(#arrow)}.box{fill:#fff;stroke:#dbe1e5;stroke-width:2;rx:18;filter:url(#shadow)}
    </style>
  </defs>
  <rect width="1400" height="760" fill="#f3f5f7"/>
  <rect width="1400" height="116" fill="url(#header)"/>
  <text x="70" y="56" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#fff">BGP Incident Analyzer</text>
  <text x="70" y="88" font-family="Arial,sans-serif" font-size="17" fill="#b9cbd1">Control-plane evidence architecture</text>

  <text x="70" y="177" class="tag">PUBLIC DATA SOURCES</text>
  <rect x="70" y="205" width="270" height="140" class="box"/>
  <circle cx="118" cy="255" r="20" fill="#57d9b8"/><text x="155" y="261" class="label">RIPE RIS</text>
  <text x="108" y="306" class="small">Route collectors</text>
  <rect x="70" y="385" width="270" height="140" class="box"/>
  <circle cx="118" cy="435" r="20" fill="#75bda7"/><text x="155" y="441" class="label">Route Views</text>
  <text x="108" y="486" class="small">Global BGP archives</text>

  <path d="M340 275H455" class="flow"/><path d="M340 455H405Q455 455 455 405V355" class="flow"/>
  <rect x="480" y="260" width="310" height="210" class="box"/>
  <text x="520" y="310" class="tag">COLLECTION LAYER</text>
  <text x="520" y="357" class="label">CAIDA BGPStream</text>
  <text x="520" y="398" class="small">bgpreader process</text>
  <text x="520" y="430" class="small">Bounded 90-second query</text>

  <path d="M790 365H905" class="flow"/>
  <rect x="930" y="205" width="400" height="320" class="box"/>
  <text x="970" y="255" class="tag">ANALYSIS SERVICE</text>
  <text x="970" y="302" class="label">FastAPI</text>
  <text x="970" y="342" class="small">Input and time-window validation</text>
  <text x="970" y="376" class="small">Prefix resolution via RIPEstat</text>
  <text x="970" y="410" class="small">Event parsing and aggregation</text>
  <text x="970" y="444" class="small">Severity and finding generation</text>
  <rect x="970" y="470" width="174" height="32" rx="16" fill="#effaf6"/><text x="1057" y="492" text-anchor="middle" class="tag">READ ONLY</text>

  <path d="M1130 525V610" class="flow"/>
  <rect x="875" y="625" width="510" height="92" class="box"/>
  <text x="915" y="664" class="label">Browser workspace</text>
  <text x="915" y="692" class="small">Timeline, AS paths and event log</text>
  <text x="915" y="708" font-family="Arial,sans-serif" font-size="15" fill="#62717a">Copy summary and export complete JSON</text>

  <rect x="70" y="596" width="680" height="121" rx="18" fill="#fff8ed" stroke="#ead3af" stroke-width="2"/>
  <text x="108" y="637" class="tag" fill="#8a5317">EVIDENCE BOUNDARY</text>
  <text x="108" y="674" class="small">Public BGP control-plane observations only</text>
  <text x="108" y="703" class="small">Correlate with MTR, packet capture and provider telemetry</text>
</svg>
