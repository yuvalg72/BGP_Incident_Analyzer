<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">BGP incident analysis workflow</title>
  <desc id="desc">A six-step workflow from entering a resource to exporting evidence and correlating it with operational telemetry.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#10262d" flood-opacity=".11"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#126d61"/></marker>
    <style>.h{font:700 28px Arial,sans-serif;fill:#142027}.n{font:800 22px Arial,sans-serif;fill:#fff}.t{font:700 21px Arial,sans-serif;fill:#142027}.s{font:400 16px Arial,sans-serif;fill:#62717a}.box{fill:#fff;stroke:#dbe1e5;stroke-width:2;rx:16;filter:url(#shadow)}.flow{fill:none;stroke:#126d61;stroke-width:5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1400" height="760" fill="#f3f5f7"/>
  <text x="70" y="70" class="h">From incident timestamp to defensible routing evidence</text>
  <text x="70" y="104" class="s">UTC-first workflow with explicit source and confidence boundaries</text>

  <path d="M360 238H505" class="flow"/><path d="M895 238H1040" class="flow"/>
  <path d="M1195 333V426" class="flow"/><path d="M1040 525H895" class="flow"/><path d="M505 525H360" class="flow"/>

  <g><rect x="70" y="155" width="290" height="166" class="box"/><circle cx="116" cy="202" r="24" fill="#126d61"/><text x="116" y="210" text-anchor="middle" class="n">1</text><text x="154" y="207" class="t">Define incident</text><text x="108" y="252" class="s">IP or prefix</text><text x="108" y="281" class="s">Start and end time in UTC</text></g>
  <g><rect x="505" y="155" width="390" height="166" class="box"/><circle cx="551" cy="202" r="24" fill="#126d61"/><text x="551" y="210" text-anchor="middle" class="n">2</text><text x="589" y="207" class="t">Resolve and validate</text><text x="543" y="252" class="s">Map IP to covering prefix</text><text x="543" y="281" class="s">Enforce seven-day query limit</text></g>
  <g><rect x="1040" y="155" width="290" height="166" class="box"/><circle cx="1086" cy="202" r="24" fill="#126d61"/><text x="1086" y="210" text-anchor="middle" class="n">3</text><text x="1124" y="207" class="t">Collect updates</text><text x="1078" y="252" class="s">RIPE RIS</text><text x="1078" y="281" class="s">Route Views</text></g>
  <g><rect x="1040" y="442" width="290" height="166" class="box"/><circle cx="1086" cy="489" r="24" fill="#126d61"/><text x="1086" y="497" text-anchor="middle" class="n">4</text><text x="1124" y="494" class="t">Classify evidence</text><text x="1078" y="539" class="s">Announcements</text><text x="1078" y="565" class="s">Withdrawals, origins and paths</text></g>
  <g><rect x="505" y="442" width="390" height="166" class="box"/><circle cx="551" cy="489" r="24" fill="#126d61"/><text x="551" y="497" text-anchor="middle" class="n">5</text><text x="589" y="494" class="t">Review findings</text><text x="543" y="539" class="s">Timeline and collector coverage</text><text x="543" y="568" class="s">Severity with visible source mode</text></g>
  <g><rect x="70" y="442" width="290" height="166" class="box"/><circle cx="116" cy="489" r="24" fill="#126d61"/><text x="116" y="497" text-anchor="middle" class="n">6</text><text x="154" y="488" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#142027">Export and</text><text x="154" y="512" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#142027">correlate</text><text x="108" y="550" class="s">Copy summary or JSON</text><text x="108" y="578" class="s">Compare MTR and packet data</text></g>

  <rect x="70" y="668" width="1260" height="52" rx="12" fill="#142d38"/>
  <text x="700" y="701" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">A BGP finding supports the incident record. It does not prove the packet path.</text>
</svg>
